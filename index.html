<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <main class="container">
      <section class="section1">
        <h1 class="section1-title">Your Result</h1>

        <div class="blu">
          <span class="u76">76</span>
          <span class="of100">of 100</span>
        </div>

        <h2 class="textg">Great</h2>

        <p class="text1">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>
      <section class="text2">
        <h2 class="section2-title">Summary</h2>

        <div class="teg">
          <div class="tiro reaction">
            <div class="item-name">
              <span class="item-icon"
                ><img src="../uygavazfa/svg/chaqmoq.svg" alt=""
              /></span>
              <span>Reaction</span>
            </div>
            <p><strong>80</strong> <span>/ 100</span></p>
          </div>

          <div class="tiro memory">
            <div class="item-name">
              <span class="item-icon"><img src="./svg/miya.svg" alt="" /></span>
              <span>Memory</span>
            </div>
            <p><strong>92</strong> <span>/ 100</span></p>
          </div>

          <div class="tiro verbal">
            <div class="item-name">
              <span class="item-icon"><img src="./svg/chat.svg" alt="" /></span>
              <span>Verbal</span>
            </div>
            <p><strong>61</strong> <span>/ 100</span></p>
          </div>

          <div class="tiro visual">
            <div class="tiro-name">
              <span class="btn-icon"><img src="./svg/koz.svg" alt="" /></span>
              <span>Visual</span>
            </div>
            <p><strong>72</strong> <span>/ 100</span></p>
          </div>
        </div>

        <button class="continue-btn">Continue</button>
      </section>
    </main>
  </body>
</html>
